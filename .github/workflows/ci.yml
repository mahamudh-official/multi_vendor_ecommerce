name: Continuous Integration

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-tests:
    name: Backend Tests & Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketplace_user
          POSTGRES_PASSWORD: marketplace_pass
          POSTGRES_DB: marketplace_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic Database Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://marketplace_user:marketplace_pass@localhost:5432/marketplace_db
          SECRET_KEY: ci-test-secret-key-do-not-use-in-production-min-32-chars
          ENVIRONMENT: test
        run: |
          alembic upgrade head

      - name: Execute Pytest Test Suite
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://marketplace_user:marketplace_pass@localhost:5432/marketplace_db
          SECRET_KEY: ci-test-secret-key-do-not-use-in-production-min-32-chars
          ENVIRONMENT: test
        run: |
          pytest -v

  frontend-tests:
    name: Frontend Analyzer & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        working-directory: ./frontend
        run: flutter pub get

      - name: Run Static Code Analysis
        working-directory: ./frontend
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Flutter Unit and BLoC Tests
        working-directory: ./frontend
        run: flutter test

