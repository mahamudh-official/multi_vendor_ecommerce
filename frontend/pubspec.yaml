name: multi_vendor_ecommerce
description: "A production-quality multi-vendor marketplace application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # Networking
  dio: ^5.11.0

  # Routing
  go_router: ^18.0.0

  # Dependency Injection
  get_it: ^9.2.1

  # Secure Storage
  flutter_secure_storage: ^11.0.0

  # Serialization
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.5
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
